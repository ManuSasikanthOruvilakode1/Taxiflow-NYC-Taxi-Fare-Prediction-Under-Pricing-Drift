[project]
name = "taxiflow"
version = "1.0.0"
description = "Taxiflow: NYC taxi fare prediction under pricing drift, with conformal prediction intervals."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.13"
dependencies = [
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "lightgbm>=4.3.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "tzdata>=2024.1",
]

[project.scripts]
taxiflow = "taxiflow.cli:app"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.0",
    "ruff>=0.6",
]
geo = ["pyshp>=2.3", "shapely>=2.0", "pyproj>=3.6"]
viz = ["matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taxiflow"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
