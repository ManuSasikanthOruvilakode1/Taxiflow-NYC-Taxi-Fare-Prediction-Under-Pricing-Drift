name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"
      - name: Install
        run: uv sync --python 3.11 --locked
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Test
        run: uv run pytest -v
